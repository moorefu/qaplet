{
  "name": "M0 Fast / Cross / Full (locked inputs)",
  "on": {
    "push": {
      "branches": [
        "**"
      ],
      "tags": [
        "v*rc*",
        "v*RC*"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {
      "inputs": {
        "tier": {
          "description": "Replay a tier on this exact ref",
          "type": "choice",
          "required": true,
          "default": "cross",
          "options": [
            "fast",
            "cross",
            "full"
          ]
        }
      }
    },
    "schedule": [
      {
        "cron": "17 3 * * *"
      }
    ]
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "tier-plan": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "tier": "${{ steps.plan.outputs.tier }}",
        "run_cross": "${{ steps.plan.outputs.run_cross }}",
        "run_full": "${{ steps.plan.outputs.run_full }}",
        "write_cache": "${{ steps.plan.outputs.write_cache }}",
        "native_matrix": "${{ steps.plan.outputs.native_matrix }}",
        "cache_key": "${{ steps.plan.outputs.cache_key }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "id": "plan",
          "name": "Select shared tier and report capability states",
          "env": {
            "CI_EVENT_NAME": "${{ github.event_name }}",
            "CI_REF": "${{ github.ref }}"
          },
          "run": "python scripts/ci_tiers.py plan --event-name \"$CI_EVENT_NAME\" --event-json \"$GITHUB_EVENT_PATH\" --ref \"$CI_REF\" --github-output \"$GITHUB_OUTPUT\" --report out/tier/plan.json"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-tier-${{ github.sha }}",
            "path": "out/tier/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Local checks before acquisition and compilation",
          "run": "make check OUT=out/m0/check"
        },
        {
          "name": "Restore immutable inputs (verification remains mandatory)",
          "id": "cache",
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": ".cache/downloads/cosmocc.zip\n.cache/quickjs\n.cache/toolchains/cosmocc\n.cache/sources/ape-loader\n.cache/tools/zig/0.15.2",
            "key": "${{ needs.tier-plan.outputs.cache_key }}"
          }
        },
        {
          "name": "Explicitly acquire exact locked upstream artifact",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python scripts/fetch_locked_toolchain.py --archive .cache/downloads/cosmocc.zip --report out/m0/acquisition.json"
        },
        {
          "name": "Populate locked input caches explicitly",
          "run": "make quickjs-fetch toolchain-fetch TOOLCHAIN_ARCHIVE=.cache/downloads/cosmocc.zip OUT=out/m0/inputs"
        },
        {
          "name": "Explicitly acquire locked loader and packer sources",
          "run": "python scripts/ape_helpers.py fetch --report out/m0/inputs/ape-helpers.json"
        },
        {
          "name": "Build and locally verify both fat probes using shared recipe",
          "run": "make build-ape OUT=out/m0"
        },
        {
          "name": "Ubuntu-build independent native I/O artifact",
          "run": "python scripts/native_io.py build --output-dir out/m0/io/artifacts --report out/m0/io/build-info.json"
        },
        {
          "name": "Ubuntu-build independent 64K deep probe",
          "run": "python scripts/pages64k.py build --output-dir out/m0/pages64k/artifacts --report out/m0/pages64k/build-info.json"
        },
        {
          "name": "Explicitly acquire locked Ubuntu helper compiler",
          "run": "python scripts/startup_loaders.py fetch --report out/m0/inputs/startup-loaders.json"
        },
        {
          "name": "Ubuntu-build separate native loaders",
          "run": "python scripts/startup_loaders.py build --producer-report out/m0/build-info.json --output-dir out/m0/loaders --report out/m0/loaders/helpers.json"
        },
        {
          "name": "Ubuntu-build sealed SDK and public CLI/Host/application APEs",
          "run": "python scripts/sdk.py build --output-dir out/sdk/artifacts --report out/sdk/build.json"
        },
        {
          "name": "Execute complete Linux Fast SDK contracts and 1000 lifecycle cycles",
          "run": "python scripts/sdk.py run --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --loader-dir out/m0/loaders --expected-os Linux --expected-arch x86_64 --runner-label ubuntu-24.04 --report out/sdk/fast/run.json"
        },
        {
          "name": "Consume actual SDK ZIP outside the source tree on Ubuntu",
          "run": "python scripts/sdk.py package-consume --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --output-dir out/sdk/external --loader-dir out/m0/loaders --report out/sdk/package-consume.json"
        },
        {
          "name": "Verify creation rollback with a separate Ubuntu controlled system fixture",
          "run": "python scripts/sdk.py fault-consume --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --output-dir out/sdk/fault-artifacts --loader-dir out/m0/loaders --report out/sdk/fault-consume.json"
        },
        {
          "name": "Verify Linux Fast native SDK evidence and lifecycle",
          "run": "python scripts/sdk.py matrix --profile fast --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --loader-dir out/m0/loaders --input-report out/sdk/fast/run.json --report out/sdk/fast-matrix.json"
        },
        {
          "name": "Ubuntu-build independent M2 waker and socket probes",
          "run": "python scripts/m2_waker.py build --output-dir out/m2-probes/waker/artifacts --report out/m2-probes/waker/build-info.json"
        },
        {
          "name": "Ubuntu-build independent M2 pipe and borrowed stdio probes",
          "run": "python scripts/m2_stdio.py build --output-dir out/m2-probes/stdio/artifacts --report out/m2-probes/stdio/build-info.json"
        },
        {
          "name": "Execute M2 Linux Fast waker and socket facts",
          "run": "python scripts/m2_waker.py run --build-report out/m2-probes/waker/build-info.json --artifact out/m2-probes/waker/artifacts/m2-waker.com --loader-dir out/m0/loaders --expected-os Linux --expected-arch x86_64 --runner-label ubuntu-24.04 --report out/m2-probes/fast/waker.json"
        },
        {
          "name": "Execute M2 Linux Fast pipe cancellation and borrowing facts",
          "run": "python scripts/m2_stdio.py run --build-report out/m2-probes/stdio/build-info.json --artifact out/m2-probes/stdio/artifacts/m2-stdio.com --loader-dir out/m0/loaders --expected-os Linux --expected-arch x86_64 --runner-label ubuntu-24.04 --report out/m2-probes/fast/stdio.json"
        },
        {
          "name": "Install tracing for actual disconnected Full rebuild",
          "if": "${{ needs.tier-plan.outputs.run_full == 'true' }}",
          "run": "sudo apt-get update\nsudo apt-get install -y --no-install-recommends strace"
        },
        {
          "name": "Execute disconnected pair and supplier refusals",
          "if": "${{ needs.tier-plan.outputs.run_full == 'true' }}",
          "run": "mkdir -p out/m0/offline\nsudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_WORKFLOW,GITHUB_SHA,RUNNER_OS,RUNNER_ARCH,RUNNER_NAME,ImageOS,ImageVersion python scripts/offline_integrity.py run --cache-root \"$PWD/.cache\" --uid \"$(id -u)\" --gid \"$(id -g)\" --report out/m0/offline/offline-integrity.json"
        },
        {
          "name": "Seal current offline recipe and helper bytes for transport",
          "if": "${{ needs.tier-plan.outputs.run_full == 'true' }}",
          "run": "python scripts/ci_tiers.py seal-offline --offline-report out/m0/offline/offline-integrity.json --report out/m0/offline/transport-receipt.json"
        },
        {
          "name": "Save only verified trusted default-branch inputs",
          "if": "${{ success() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.tier-plan.outputs.write_cache == 'true' }}",
          "uses": "actions/cache/save@v4",
          "with": {
            "path": ".cache/downloads/cosmocc.zip\n.cache/quickjs\n.cache/toolchains/cosmocc\n.cache/sources/ape-loader\n.cache/tools/zig/0.15.2",
            "key": "${{ needs.tier-plan.outputs.cache_key }}"
          }
        },
        {
          "name": "Distribute complete SDK including hidden ARM64 archive and raw Fast evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m1-sdk-build-${{ github.sha }}",
            "path": "out/sdk/",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Distribute independent M2 probe bytes and every Fast failure",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m2-probes-build-${{ github.sha }}",
            "path": "out/m2-probes/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Distribute original bytes and all evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-build-${{ github.sha }}",
            "path": "out/m0/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "needs": "tier-plan"
    },
    "native-startup": {
      "needs": [
        "tier-plan",
        "build"
      ],
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 10,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "runner": "ubuntu-24.04",
              "os": "Linux",
              "arch": "x86_64"
            },
            {
              "runner": "windows-2022",
              "os": "Windows",
              "arch": "x86_64"
            },
            {
              "runner": "macos-15-intel",
              "os": "Darwin",
              "arch": "x86_64"
            },
            {
              "runner": "macos-15",
              "os": "Darwin",
              "arch": "aarch64"
            },
            {
              "runner": "ubuntu-24.04-arm",
              "os": "Linux",
              "arch": "aarch64"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "m0-build-${{ github.sha }}",
            "path": "out/m0"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "m1-sdk-build-${{ github.sha }}",
            "path": "out/sdk"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "m2-probes-build-${{ github.sha }}",
            "path": "out/m2-probes"
          }
        },
        {
          "name": "Measure native host and execute unchanged producer bytes",
          "run": "python scripts/startup.py run --build-report out/m0/build-info.json --artifact-dir out/m0/artifacts --loader-dir out/m0/loaders --expected-os ${{ matrix.os }} --expected-arch ${{ matrix.arch }} --runner-label ${{ matrix.runner }} --report out/startup/${{ matrix.runner }}/startup.json"
        },
        {
          "name": "Execute supplied SDK contracts and lifecycle on the same measured native host",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/sdk.py run --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --loader-dir out/m0/loaders --expected-os ${{ matrix.os }} --expected-arch ${{ matrix.arch }} --runner-label ${{ matrix.runner }} --report out/sdk-native/${{ matrix.runner }}/run.json"
        },
        {
          "name": "Measure M2 native waker and socket facts using supplied bytes",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/m2_waker.py run --build-report out/m2-probes/waker/build-info.json --artifact out/m2-probes/waker/artifacts/m2-waker.com --loader-dir out/m0/loaders --expected-os ${{ matrix.os }} --expected-arch ${{ matrix.arch }} --runner-label ${{ matrix.runner }} --report out/m2-probes-native/${{ matrix.runner }}/waker.json"
        },
        {
          "name": "Measure M2 native pipe cancellation and safe borrowing facts",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/m2_stdio.py run --build-report out/m2-probes/stdio/build-info.json --artifact out/m2-probes/stdio/artifacts/m2-stdio.com --loader-dir out/m0/loaders --expected-os ${{ matrix.os }} --expected-arch ${{ matrix.arch }} --runner-label ${{ matrix.runner }} --report out/m2-probes-native/${{ matrix.runner }}/stdio.json"
        },
        {
          "name": "Retain every native M2 probe observation and cleanup log",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m2-probes-native-${{ matrix.runner }}-${{ github.sha }}",
            "path": "out/m2-probes-native/${{ matrix.runner }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Plan from actual native ARM64 page measurement",
          "id": "native-pages",
          "if": "${{ !cancelled() && needs.tier-plan.outputs.run_full == 'true' && matrix.os == 'Linux' && matrix.arch == 'aarch64' }}",
          "run": "python scripts/startup.py page-gaps --input-report out/startup/${{ matrix.runner }}/startup.json --github-output \"$GITHUB_OUTPUT\" --report out/startup/${{ matrix.runner }}/page-plan.json"
        },
        {
          "name": "Run deep probe when native ARM64 actually has 64K pages",
          "if": "${{ !cancelled() && steps.native-pages.outputs.native_page_size == '65536' }}",
          "run": "python scripts/pages64k.py run-native --input-report out/m0/pages64k/build-info.json --artifact out/m0/pages64k/artifacts/pages64k.com --loader out/m0/loaders/ape-aarch64.elf --report out/pages64k/${{ matrix.runner }}/pages64k.json"
        },
        {
          "name": "Measure native handles and controlled terminal/process fixtures",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/native_io.py run --build-report out/m0/io/build-info.json --artifact out/m0/io/artifacts/native-io.com --loader-dir out/m0/loaders --expected-os ${{ matrix.os }} --expected-arch ${{ matrix.arch }} --runner-label ${{ matrix.runner }} --report out/io/${{ matrix.runner }}/io.json"
        },
        {
          "name": "Retain every native SDK contract, lifecycle and raw log",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m1-sdk-native-${{ matrix.runner }}-${{ github.sha }}",
            "path": "out/sdk-native/${{ matrix.runner }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Retain every native result and raw log",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-startup-${{ matrix.runner }}-${{ github.sha }}",
            "path": "out/startup/${{ matrix.runner }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Retain every I/O result and cleanup log",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-io-${{ matrix.runner }}-${{ github.sha }}",
            "path": "out/io/${{ matrix.runner }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Retain native 64K deep evidence when selected",
          "if": "${{ always() && steps.native-pages.outputs.native_page_size == '65536' }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-pages64k-native-${{ matrix.runner }}-${{ github.sha }}",
            "path": "out/pages64k/${{ matrix.runner }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "if": "${{ needs.tier-plan.outputs.run_cross == 'true' }}"
    },
    "page-plan": {
      "needs": [
        "tier-plan",
        "build",
        "native-startup"
      ],
      "if": "${{ always() && needs.tier-plan.outputs.run_full == 'true' && needs.build.result == 'success' }}",
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 5,
      "outputs": {
        "matrix": "${{ steps.plan.outputs.matrix }}",
        "needs_guest": "${{ steps.plan.outputs.needs_guest }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Read actual native ARM64 measurement",
          "uses": "actions/download-artifact@v8",
          "continue-on-error": true,
          "with": {
            "name": "m0-startup-ubuntu-24.04-arm-${{ github.sha }}",
            "path": "out/native-arm64"
          }
        },
        {
          "name": "Compute only missing measured page configurations",
          "id": "plan",
          "run": "python scripts/startup.py page-gaps --input-report out/native-arm64/startup.json --github-output \"$GITHUB_OUTPUT\" --report out/page-plan/plan.json"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-page-plan-${{ github.sha }}",
            "path": "out/page-plan/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "arm64-page-gaps": {
      "needs": [
        "tier-plan",
        "build",
        "page-plan"
      ],
      "if": "${{ always() && needs.tier-plan.outputs.run_full == 'true' && needs.build.result == 'success' && needs.page-plan.outputs.needs_guest == 'true' }}",
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "matrix": "${{ fromJSON(needs.page-plan.outputs.matrix) }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "m0-build-${{ github.sha }}",
            "path": "out/m0"
          }
        },
        {
          "name": "Install the locked QEMU major/minor runtime with repository caches",
          "run": "mkdir -p .cache/apt/cache/archives/partial .cache/apt/lists/partial\nsudo apt-get -o Dir::Cache=\"$PWD/.cache/apt/cache\" -o Dir::State::lists=\"$PWD/.cache/apt/lists\" update\nsudo apt-get -y --no-install-recommends -o Dir::Cache=\"$PWD/.cache/apt/cache\" -o Dir::State::lists=\"$PWD/.cache/apt/lists\" install qemu-system-arm"
        },
        {
          "name": "Download the identical SDK producer for missing 64K validation",
          "if": "${{ matrix.page_size == 65536 }}",
          "uses": "actions/download-artifact@v8",
          "with": {"name": "m1-sdk-build-${{ github.sha }}", "path": "out/sdk"}
        },
        {
          "name": "Explicitly fetch immutable locked guest inputs",
          "run": "python scripts/arm64_guest.py fetch --cache .cache/guests --page-size ${{ matrix.page_size }} --report out/page-gaps/${{ matrix.page_size }}/acquisition.json"
        },
        {
          "name": "Prepare verified guest kernel and userland offline",
          "run": "python scripts/arm64_guest.py prepare --cache .cache/guests --page-size ${{ matrix.page_size }} --report out/page-gaps/${{ matrix.page_size }}/prepared.json"
        },
        {
          "name": "Export seven startup cases on identical producer bytes",
          "run": "python scripts/startup.py guest-manifest --build-report out/m0/build-info.json --artifact-dir out/m0/artifacts --loader-dir out/m0/loaders --page-size ${{ matrix.page_size }} --manifest out/page-gaps/${{ matrix.page_size }}/startup-manifest.json --report out/page-gaps/${{ matrix.page_size }}/startup-export.json"
        },
        {
          "name": "Export independent native I/O suite",
          "run": "python scripts/native_io.py guest-manifest --build-report out/m0/io/build-info.json --artifact out/m0/io/artifacts/native-io.com --loader out/m0/loaders/ape-aarch64.elf --page-size ${{ matrix.page_size }} --manifest out/page-gaps/${{ matrix.page_size }}/io-manifest.json --report out/page-gaps/${{ matrix.page_size }}/io-export.json"
        },
        {
          "name": "Export deep probe only for the missing 64K target",
          "if": "${{ matrix.page_size == 65536 }}",
          "run": "python scripts/pages64k.py guest-manifest --input-report out/m0/pages64k/build-info.json --guest-cache .cache/guests --report out/page-gaps/${{ matrix.page_size }}/pages-manifest.json"
        },
        {
          "name": "Merge distinct same-byte payloads for 4096 pages",
          "if": "${{ matrix.page_size == 4096 }}",
          "run": "python scripts/arm64_guest.py merge-manifests --input-manifest out/page-gaps/${{ matrix.page_size }}/startup-manifest.json --input-manifest out/page-gaps/${{ matrix.page_size }}/io-manifest.json --manifest out/page-gaps/${{ matrix.page_size }}/manifest.json --page-size 4096 --report out/page-gaps/${{ matrix.page_size }}/merged.json"
        },
        {
          "name": "Merge distinct same-byte payloads for 65536 pages",
          "if": "${{ matrix.page_size == 65536 }}",
          "run": "python scripts/arm64_guest.py merge-manifests --input-manifest out/page-gaps/${{ matrix.page_size }}/startup-manifest.json --input-manifest out/page-gaps/${{ matrix.page_size }}/io-manifest.json --input-manifest out/page-gaps/${{ matrix.page_size }}/pages-manifest.json --manifest out/page-gaps/${{ matrix.page_size }}/manifest.json --page-size 65536 --report out/page-gaps/${{ matrix.page_size }}/merged.json"
        },
        {
          "name": "Boot actual locked full-system TCG guest",
          "run": "python scripts/arm64_guest.py run --cache .cache/guests --page-size ${{ matrix.page_size }} --manifest out/page-gaps/${{ matrix.page_size }}/manifest.json --report out/page-gaps/${{ matrix.page_size }}/guest.json"
        },
        {
          "name": "Validate actual startup semantics and transfer identities",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/startup.py import-guest --build-report out/m0/build-info.json --artifact-dir out/m0/artifacts --guest-report out/page-gaps/${{ matrix.page_size }}/guest.json --report out/page-gaps/${{ matrix.page_size }}/startup.json"
        },
        {
          "name": "Validate actual I/O semantics and controlled Unicode process fixture",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/native_io.py import-guest --build-report out/m0/io/build-info.json --artifact out/m0/io/artifacts/native-io.com --guest-report out/page-gaps/${{ matrix.page_size }}/guest.json --report out/page-gaps/${{ matrix.page_size }}/io.json"
        },
        {
          "name": "Validate all required 64K deep observations",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/pages64k.py verify-guest --input-report out/m0/pages64k/build-info.json --guest-report out/page-gaps/${{ matrix.page_size }}/guest.json --report out/page-gaps/${{ matrix.page_size }}/pages64k.json"
        },
        {
          "name": "Export the same SDK critical contracts to an independent 64K payload",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/sdk_guest.py export --build-report out/sdk/build.json --distribution out/sdk/artifacts --manifest out/page-gaps/${{ matrix.page_size }}/sdk/payload.json --selection out/page-gaps/${{ matrix.page_size }}/sdk/selection.json --report out/page-gaps/${{ matrix.page_size }}/sdk/export.json"
        },
        {
          "name": "Execute actual SDK contracts on the missing locked 64K kernel",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/arm64_guest.py run --cache .cache/guests --page-size 65536 --manifest out/page-gaps/${{ matrix.page_size }}/sdk/payload.json --timeout 900 --command-timeout 60 --report out/page-gaps/${{ matrix.page_size }}/sdk/guest.json"
        },
        {
          "name": "Independently verify the SDK 64K serial semantics and byte identities",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/sdk_guest.py import --selection out/page-gaps/${{ matrix.page_size }}/sdk/selection.json --guest-report out/page-gaps/${{ matrix.page_size }}/sdk/guest.json --report out/page-gaps/${{ matrix.page_size }}/sdk/import.json"
        },
        {
          "name": "Download identical M2 probe bytes for the missing 64K target",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "uses": "actions/download-artifact@v8",
          "with": {"name": "m2-probes-build-${{ github.sha }}", "path": "out/m2-probes"}
        },
        {
          "name": "Export M2 waker probes to the actual 64K kernel",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/m2_waker.py guest-manifest --build-report out/m2-probes/waker/build-info.json --artifact out/m2-probes/waker/artifacts/m2-waker.com --loader out/m2-probes/waker/artifacts/ape-aarch64.elf --page-size 65536 --manifest out/page-gaps/65536/m2/waker-payload.json --report out/page-gaps/65536/m2/waker-export.json"
        },
        {
          "name": "Export M2 pipe and stdio probes to the actual 64K kernel",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/m2_stdio.py guest-manifest --build-report out/m2-probes/stdio/build-info.json --artifact out/m2-probes/stdio/artifacts/m2-stdio.com --loader out/m2-probes/stdio/artifacts/ape-aarch64.elf --page-size 65536 --manifest out/page-gaps/65536/m2/stdio-payload.json --report out/page-gaps/65536/m2/stdio-export.json"
        },
        {
          "name": "Merge independent M2 probe payloads without changing producer bytes",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/arm64_guest.py merge-manifests --page-size 65536 --input-manifest out/page-gaps/65536/m2/waker-payload.json --input-manifest out/page-gaps/65536/m2/stdio-payload.json --manifest out/page-gaps/65536/m2/payload.json --report out/page-gaps/65536/m2/merged.json"
        },
        {
          "name": "Execute current M2 probes on the locked actual 64K guest",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/arm64_guest.py run --cache .cache/guests --page-size 65536 --manifest out/page-gaps/65536/m2/payload.json --timeout 300 --command-timeout 60 --report out/page-gaps/65536/m2/guest.json"
        },
        {
          "name": "Independently verify M2 guest waker and socket semantics",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/m2_waker.py import-guest --build-report out/m2-probes/waker/build-info.json --artifact out/m2-probes/waker/artifacts/m2-waker.com --guest-report out/page-gaps/65536/m2/guest.json --report out/page-gaps/65536/m2/waker.json"
        },
        {
          "name": "Independently verify M2 guest pipe and stdio semantics",
          "if": "${{ !cancelled() && matrix.page_size == 65536 }}",
          "run": "python scripts/m2_stdio.py import-guest --build-report out/m2-probes/stdio/build-info.json --artifact out/m2-probes/stdio/artifacts/m2-stdio.com --guest-report out/page-gaps/65536/m2/guest.json --report out/page-gaps/65536/m2/stdio.json"
        },
        {
          "name": "Retain guest failures, serial bytes and semantic reports",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-page-gap-${{ matrix.page_size }}-${{ github.sha }}",
            "path": "out/page-gaps/${{ matrix.page_size }}/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "startup-matrix": {
      "needs": [
        "tier-plan",
        "build",
        "native-startup",
        "arm64-page-gaps"
      ],
      "if": "${{ always() && needs.tier-plan.outputs.run_cross == 'true' && needs.build.result == 'success' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "m0-build-${{ github.sha }}",
            "path": "out/m0"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "continue-on-error": true,
          "with": {
            "pattern": "m0-startup-*-${{ github.sha }}",
            "path": "out/startup-results"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "continue-on-error": true,
          "with": {
            "pattern": "m0-page-gap-*-${{ github.sha }}",
            "path": "out/startup-results"
          }
        },
        {
          "name": "Require all six measured targets on the new producer identities",
          "run": "python scripts/startup.py matrix --build-report out/m0/build-info.json --artifact-dir out/m0/artifacts --input-dir out/startup-results --profile \"$CI_TIER\" --report out/startup-matrix/matrix.json",
          "env": {
            "CI_TIER": "${{ needs.tier-plan.outputs.tier }}"
          }
        },
        {
          "uses": "actions/download-artifact@v8",
          "if": "${{ !cancelled() }}",
          "with": {"name": "m1-sdk-build-${{ github.sha }}", "path": "out/sdk"}
        },
        {
          "uses": "actions/download-artifact@v8",
          "if": "${{ !cancelled() }}",
          "continue-on-error": true,
          "with": {"pattern": "m1-sdk-native-*-${{ github.sha }}", "path": "out/sdk-native"}
        },
        {
          "name": "Require complete same-byte SDK contracts and lifecycle on all five native hosts",
          "if": "${{ !cancelled() }}",
          "run": "python scripts/sdk.py matrix --profile cross --build-report out/sdk/build.json --artifact out/sdk/artifacts/qaplet-host.com --loader-dir out/m0/loaders --input-dir out/sdk-native --report out/sdk-matrix/matrix.json"
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m1-sdk-matrix-${{ github.sha }}", "path": "out/sdk-matrix/",
            "if-no-files-found": "error", "retention-days": 7
          }
        },
        {
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-startup-matrix-${{ github.sha }}",
            "path": "out/startup-matrix/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "full-core": {
      "needs": [
        "tier-plan",
        "build",
        "native-startup",
        "arm64-page-gaps",
        "startup-matrix"
      ],
      "if": "${{ always() && needs.tier-plan.outputs.run_full == 'true' && needs.build.result == 'success' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Collect original current-run ZIPs with provider digests",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}",
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "python scripts/ci_tiers.py collect-actions --commit \"$CI_COMMIT\" --output-dir out/full/archives --report out/full/acquisition.json"
        },
        {
          "name": "Select required same-commit Full inputs without rewriting reports",
          "env": {
            "CI_COMMIT": "${{ github.sha }}"
          },
          "run": "python scripts/ci_tiers.py manifest --collection-report out/full/collection.json --commit \"$CI_COMMIT\" --report out/full/manifest.json"
        },
        {
          "name": "Run existing read-only full Core consumer",
          "run": "python scripts/core_gate.py evaluate --input-manifest out/full/manifest.json --report out/full/core.json"
        },
        {
          "name": "Retain original archives, consumer report and raw failure logs",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "m0-full-core-${{ github.sha }}",
            "path": "out/full/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
