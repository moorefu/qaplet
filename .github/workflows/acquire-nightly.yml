{
  "name": "Acquire official cosmocc Nightly",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {"contents": "read"},
  "jobs": {
    "download": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-python@v7", "with": {"python-version": "3.13"}},
        {
          "name": "Fetch original Nightly bytes and measured acquisition receipt",
          "run": "python scripts/nightly_toolchain.py download --download-to .cache/downloads/nightly/cosmocc.zip --report out/nightly-download/acquisition.json --download-timeout 900"
        },
        {
          "name": "Preserve original archive and acquisition evidence",
          "uses": "actions/upload-artifact@v7",
          "if": "${{ always() }}",
          "with": {
            "name": "cosmocc-nightly-download-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".cache/downloads/nightly/\nout/nightly-download/",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
