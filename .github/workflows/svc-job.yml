{
  "name": "M0-SVC private Job ABI",
  "on": {"push": {}, "pull_request": {}, "workflow_dispatch": {}},
  "permissions": {"contents": "read", "actions": "read"},
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04", "timeout-minutes": 30,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-python@v7", "with": {"python-version": "3.13"}},
        {"name": "Private Job public contracts and CI layout", "run": "python -m unittest discover -s tests/contracts -p test_svc_job.py -v"},
        {"name": "Acquire exact locked Nightly", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "python scripts/fetch_locked_toolchain.py --archive .cache/downloads/cosmocc.zip --report out/svc-job/acquisition.json"},
        {"name": "Explicitly populate fixed toolchain", "run": "python scripts/nightly_toolchain.py fetch --archive .cache/downloads/cosmocc.zip --report out/svc-job/inputs/nightly.json"},
        {"name": "Explicitly populate source-locked helpers", "run": "python scripts/ape_helpers.py fetch --report out/svc-job/inputs/helpers.json"},
        {"name": "Ubuntu application producer and Linux ordinary entry", "run": "python scripts/svc_job.py build --output-dir out/svc-job/artifacts --report out/svc-job/build-info.json"},
        {"name": "Retain producer and failures", "if": "${{ always() }}", "uses": "actions/upload-artifact@v7", "with": {"name": "svc-job-build-${{ github.sha }}", "path": "out/svc-job/", "if-no-files-found": "error", "retention-days": 7}}
      ]
    },
    "windows-job": {
      "needs": "build", "runs-on": "windows-2022", "timeout-minutes": 10,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-python@v7", "with": {"python-version": "3.13"}},
        {"uses": "actions/download-artifact@v8", "with": {"name": "svc-job-build-${{ github.sha }}", "path": "out/svc-job/producer"}},
        {"name": "Consume same Ubuntu bytes within an owned supervisor fence", "run": "python scripts/svc_job.py run --input-report out/svc-job/producer/build-info.json --artifact out/svc-job/producer/artifacts/svc-job.com --report out/svc-job/windows/job.json"},
        {"name": "Exercise actual supervisor deadline and assert cleanup", "env": {"QAPLET_TEST_JOB_PRODUCER": "out/svc-job/producer/build-info.json"}, "run": "python -m unittest discover -s tests/contracts -p test_svc_job.py -k real_probe_deadline -v"},
        {"name": "Retain native API, process membership, deadline and cleanup evidence", "if": "${{ always() }}", "uses": "actions/upload-artifact@v7", "with": {"name": "svc-job-windows-${{ github.sha }}", "path": "out/svc-job/", "if-no-files-found": "error", "retention-days": 7}}
      ]
    }
  }
}
