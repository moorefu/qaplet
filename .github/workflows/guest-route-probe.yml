{
  "name": "Temporary locked guest DNS member probe",
  "on": {
    "push": {"branches": ["codex/m2-guest-route-probe"]}
  },
  "permissions": {"contents": "read"},
  "jobs": {
    "locked-guest-http-route": {
      "runs-on": "ubuntu-22.04",
      "timeout-minutes": 15,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-python@v7", "with": {"python-version": "3.13"}},
        {"name": "Capture each current system DNS member once", "run": "python scripts/guest_route_probe.py --mode dns-members --output-dir out/guest-dns-members"},
        {
          "name": "Preserve all response and failure evidence",
          "if": "${{ always() }}",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "guest-dns-members-${{ github.sha }}-attempt-${{ github.run_attempt }}",
            "path": "out/guest-dns-members/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
